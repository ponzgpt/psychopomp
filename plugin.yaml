name: psychopomp
version: "0.3.2"
description: >-
  Every week, Hermes helps you write a page of your life: your Book (once a year, a year in review).
  Seal letters for the people you love. If you ever go silent for good, Hermes checks in, asks your
  witness for a one-time code on any channel, and only then carries your Book and letters to them.
  Rehearse the whole passage in 20 seconds, on any surface.
author: Javier Ponz (ponzgpt)
license: MIT
homepage: https://github.com/ponzgpt/psychopomp
tags: [journal, legacy, letters, dead-mans-switch, desktop, gateway]
manifest_version: 2
requires_hermes: ">=0.23.0"
provides_tools: [psychopomp_status, psychopomp_draft_page, psychopomp_write_page, psychopomp_read_book, psychopomp_seal_letter]
provides_hooks: [pre_llm_call, pre_gateway_dispatch]
config_schema:
  owner_name:
    type: str
    label: Your name
    description: How Hermes names you to your witness and in your Book. Where Hermes reaches you is set by sending /psychopomp here from your phone.
  silence_days:
    type: int
    default: 30
    label: Days of silence before Hermes checks in
    description: Then 3 check-ins, 3 days apart, before your witness is asked for the code.
