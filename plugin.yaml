name: psychopomp
version: "0.1.0"
description: >-
  Hermes carries your words across time. A dead man's switch for Hermes Agent: seal letters,
  and if you fall silent on every surface, Hermes checks in with you, asks your trusted contact
  for a code on any channel, and only then emails your letters.
author: Javier Ponz (ponzgpt)
license: MIT
homepage: https://github.com/ponzgpt/psychopomp
tags: [legacy, letters, dead-mans-switch, desktop, gateway]
manifest_version: 2
requires_hermes: ">=0.23.0"
provides_tools: [psychopomp_status, psychopomp_seal_letter]
provides_hooks: [pre_llm_call, pre_gateway_dispatch]
requires_env:
  - name: EMAIL_ADDRESS
    description: Hermes' email account; sealed letters are sent from it (same setting as the Email gateway)
  - name: EMAIL_PASSWORD
    description: Password or app password for that account
    secret: true
  - name: EMAIL_SMTP_HOST
    description: SMTP server, e.g. smtp.gmail.com (EMAIL_SMTP_PORT defaults to 587)
config_schema:
  owner_name:
    type: str
    label: Your name
    description: How Hermes names you in check-ins and letters.
  owner_channels:
    type: str
    label: Where Hermes checks in with you
    description: Comma-separated platform:id targets, e.g. "telegram:123456, email:you@example.com".
  trusted_name:
    type: str
    label: Trusted contact's name
  trusted_channels:
    type: str
    label: Where Hermes reaches your trusted contact
    description: Comma-separated platform:id targets. They may answer with the code on any channel Hermes listens to.
  silence_days:
    type: int
    default: 30
    label: Days of silence before the first check-in
  checkin_every_days:
    type: int
    default: 3
    label: Days between check-ins
  checkins:
    type: int
    default: 3
    label: Check-ins before the trusted contact is asked
  demo_mode:
    type: bool
    default: false
    label: Demo mode (a day lasts one minute)
