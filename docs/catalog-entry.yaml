# Copy to NousResearch/hermes-agent as plugin-catalog/psychopomp.yaml; set sha to the pushed commit.
name: psychopomp
repo: https://github.com/ponzgpt/psychopomp
sha: SET_TO_40_CHAR_COMMIT
description: >-
  Hermes keeps your story and carries your words across time. Every week Hermes helps you write a page of your
  Book from what it already knows of your week (once a year, a review); seal letters for the people you love. If
  you ever fall silent for good, Hermes checks in on every channel, then asks your trusted contact for a one-time
  code they can send on any channel, and only then carries the Book and letters. Rehearse the whole passage on a
  virtual clock, with every message redirected to you. Desktop page with Book, sealed envelopes and rehearsal.
  Disclosure — sends weekly nudges, check-ins, a code request and (after the code) your Book and letters to the
  channels you configure; reads inbound gateway messages at ingress to catch PSY- codes (those are consumed);
  stores the Book and letters in plain text under $HERMES_HOME/plugin-data/psychopomp; uses Hermes'
  send_message helper, and SMTP only if EMAIL_* is set.
maintainer: ponzgpt
tier: community
category: general
requires_hermes: ">=0.23.0"
docs_url: https://github.com/ponzgpt/psychopomp
version: "0.1.0"
platforms: [linux, macos]
capabilities:
  provides_tools: [psychopomp_status, psychopomp_write_page, psychopomp_read_book, psychopomp_seal_letter]
  provides_hooks: [pre_llm_call, pre_gateway_dispatch]
  provides_middleware: []
  requires_env: []
