# Copy to NousResearch/hermes-agent as plugin-catalog/psychopomp.yaml; replace SHA (sha + image URLs) with the pushed commit.
name: psychopomp
repo: https://github.com/ponzgpt/psychopomp
sha: SHA
description: >-
  Every week, Hermes helps you write a page of your life (your Book) from what it already knows of your week;
  once a year, a year in review. Seal letters for the people you love. If you ever go silent for good, Hermes
  checks in, then asks the one person you trust for a one-time code they can send on any channel, and only then
  carries your Book and letters to them. A Desktop page explains the passage, sets you up in five minutes, and
  rehearses the whole thing in 20 seconds on a virtual clock (same switch code, nothing sent, nothing unsealed).
  Disclosure: sends weekly nudges, check-ins, a code request and (after the code) your Book and letters to the
  channels you configure; reads inbound gateway messages at ingress to catch PSY- codes (those are consumed);
  stores the Book and letters in plain text under $HERMES_HOME/plugin-data/psychopomp; uses Hermes'
  send_message helper, and SMTP only if EMAIL_* is set.
maintainer: ponzgpt
tier: community
category: general
requires_hermes: ">=0.23.0"
docs_url: https://github.com/ponzgpt/psychopomp
version: "0.2.0"
image: https://raw.githubusercontent.com/ponzgpt/psychopomp/SHA/docs/screenshots/banner.png
screenshots:
  - https://raw.githubusercontent.com/ponzgpt/psychopomp/SHA/docs/screenshots/page.png
  - https://raw.githubusercontent.com/ponzgpt/psychopomp/SHA/docs/screenshots/rehearsal.png
  - https://raw.githubusercontent.com/ponzgpt/psychopomp/SHA/docs/screenshots/first-run.png
platforms: [linux, macos]
capabilities:
  provides_tools: [psychopomp_status, psychopomp_write_page, psychopomp_read_book, psychopomp_seal_letter]
  provides_hooks: [pre_llm_call, pre_gateway_dispatch]
  provides_middleware: []
  requires_env: []
